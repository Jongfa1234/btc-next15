name: Auto predictions

# Makes a prediction for each 15-minute window and checks finished ones, even when nobody has the app open.
# GitHub's schedule is best-effort and can skip runs for a long time, so each run works for about
# 12 minutes (refreshing every minute) and then starts the next run itself. The schedule is only a backup.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Open the log branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data "$RUNNER_TEMP/data" origin/data
          else
            git worktree add --orphan -b data "$RUNNER_TEMP/data"
          fi

      - name: Predict, check and save (every minute for about 12 minutes)
        run: |
          for i in $(seq 1 12); do
            node tools/predict.mjs "$RUNNER_TEMP/data/log.json" || echo "Run $i failed"
            (
              cd "$RUNNER_TEMP/data"
              git add log.json kalshi.json 2>/dev/null || git add log.json
              if ! git diff --cached --quiet; then
                git commit -q -m "Update prediction log"
                git push -q origin data || echo "Push failed"
              fi
            )
            if [ "$i" -lt 12 ]; then sleep 55; fi
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-predict.yml --ref main -R "$GITHUB_REPOSITORY"
