name: Probe data sources (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Kalshi with and without a browser origin
        run: |
          u="https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXBTC15M&status=open&limit=2"
          echo "=== with Origin"
          curl -s -D - -o /tmp/b1 -H "Origin: https://jongfa1234.github.io" -m 15 "$u" | grep -i -E "^HTTP|access-control" || true
          head -c 400 /tmp/b1; echo
          echo "=== without Origin"
          curl -s -D - -o /tmp/b2 -m 15 "$u" | grep -i -E "^HTTP|access-control" || true
          head -c 3500 /tmp/b2; echo
          echo "=== preflight"
          curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://jongfa1234.github.io" -H "Access-Control-Request-Method: GET" -m 15 "$u" | grep -i -E "^HTTP|access-control" || true
